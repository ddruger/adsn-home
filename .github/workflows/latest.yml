name: Update latest episodes

on:
  schedule:
    - cron: "17 * * * *" # every hour
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-latest.mjs
      - name: Save if anything changed
        run: |
          if git diff --quiet latest.json; then echo "No new episodes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Update latest episodes"
          git push
